<script>
const lessons=[
{id:'cost',week:7,chapter:15,title:'1. The I/O cost model & notation',subtitle:'Turn a query-operation description into a disk-I/O estimate before choosing an algorithm.',objective:['Distinguish tuples, blocks, and buffers','Translate symbols into quantities','State what the cost model ignores'],concept:'The quiz model counts block transfers between disk and memory, not CPU instructions. Relations are stored as records packed into blocks. The algorithm moves blocks; a design touching fewer blocks is usually cheaper in this model, though not necessarily faster in wall-clock time.',analogy:'A relation is a library of boxes. T(R) counts books, B(R) counts boxes holding them, and M counts boxes you can keep open on the desk. Re-reading a box costs an I/O even when it contains many tuples.',terms:[['B(R)','Number of disk blocks/pages occupied by R.'],['T(R)','Number of tuples/records in R.'],['M','Number of buffer blocks available to this operator.'],['V(R,A)','Number of distinct values of attribute A in R.'],['I/O','One block read or write; seek/latency usually ignored.'],['ceil(x)','Round upward: a partial block/run still needs capacity.']],formula:'If d tuples fit in a block: T(R)≈d·B(R); B(R)≈ceil(T(R)/d). A full table-scan costs about B(R) reads.',procedure:['Underline what is requested: I/Os, result size, feasibility, or algorithm choice.','List given B, T, V, M. Do not substitute tuples for blocks.','Write the relevant formula and attach units to each term.','Check if output is pipelined/materialized and whether index I/Os are excluded.','Compare only algorithms that satisfy their memory and ordering assumptions.'],workedTitle:'Convert block count into tuple count',worked:['Given 2,400 blocks and 40 tuples/block: T(R)=2,400×40=96,000 tuples.','If asked for a scan, the basic table-scan cost is 2,400 block reads—not 96,000.','Add a final output-write cost only if the question requires materialization.'],book:{cite:'Textbook Chapter 15 §15.1.3, “The Computation Model for Physical Operators.”',prompt:'R occupies 2,400 blocks. How many data-block reads does a full scan need?',answer:2400,unit:'I/Os',hint:'A table-scan reads blocks, not individual tuples.',solution:'2,400 I/Os for the input scan. Tuple count is 96,000 only if 40 tuples fit per block; it is not the scan-I/O count.'},practice:{prompt:'A relation occupies 800 blocks. A full scan reads each block once. Enter the input I/O cost.',answer:800,unit:'I/Os',explain:'One sequential pass reads B(R)=800 blocks once.'},quiz:[['What does B(R) count?',['Tuples in R','Blocks occupied by R','Distinct values in R'],1,'B counts blocks/pages; T counts tuples.'],['An I/O in this model is primarily…',['one tuple comparison','one block transfer','one SQL operator'],1,'The cost model counts block reads/writes.']],lab:'storage'},
{id:'onepass',week:8,chapter:15,title:'2. One-pass algorithms & memory-fit tests',subtitle:'Decide whether an operation can finish after one scan, and identify which relation must fit.',objective:['Recognize a one-pass feasibility condition','Use memory buffers rather than tuple count','Explain what happens after building the in-memory structure'],concept:'A one-pass algorithm reads each input once and does its useful work in memory. For a binary operation, a common pattern loads one input (or a hash/search structure for it) and streams the other. “One-pass” is a feasibility claim: test the memory condition before quoting its low I/O cost.',analogy:'Put one small pile of cards on your desk, then flip through the other pile once. If the first pile does not fit, it is not one-pass; use partitioning, sorting, or repeated scans.',terms:[['B(R), B(S)','Disk blocks occupied by the two relations.'],['M','Available memory-buffer blocks.'],['M−1','Buffer capacity for the resident relation under this lecture’s one-pass convention.'],['Build side','Relation kept in memory or a hash/search structure.'],['Probe side','Relation streamed against the in-memory structure.'],['One-pass','Each input is read once.']],formula:'One-pass binary operation: min(B(R),B(S))≤M−1; input-read cost C_reads=B(R)+B(S). Add result writes separately if materialized.',procedure:['Name the operation and the in-memory structure it needs.','Choose the smaller relation and check min(B(R),B(S))≤M−1.','Load it into M−1 buffers; stream the other relation one block at a time through the remaining buffer.','Read each input once, so input cost is B(R)+B(S); add output writes only if materialized.','If the smaller relation does not fit, use a multi-pass or block-based algorithm.'],workedTitle:'Can the smaller input fit?',worked:['B(R)=18, B(S)=90, M=24. Reserve 1 buffer; approximate build budget is 23.','R fits (18≤23), so build on R and stream S once.','Base input cost=18+90=108 I/Os; add output writes only if materialized.'],book:{cite:'Textbook Chapter 15 §15.2, one-pass algorithms; Tutorial 5 “Query Processing (Part 01)” (Week 8) includes one-pass join practice.',prompt:'R=18 blocks, S=90 blocks, M=24, and 1 buffer is reserved. Is a one-pass join feasible?',answer:'yes',hint:'Compare the smaller input with M−1.',solution:'Yes. R is 18 blocks and the build budget is 24−1=23. Base input read=108 I/Os.'},practice:{prompt:'M=40; reserve 1 buffer. The smaller relation is 40 blocks. Is one-pass feasible? Answer yes or no.',answer:'no',explain:'Build limit=40−1=39 blocks; 40 does not fit.'},quiz:[['If the build relation exceeds usable memory, the one-pass cost is…',['still B(R)+B(S)','invalid; one-pass is infeasible','always 3(B(R)+B(S))'],1,'Check feasibility before cost.'],['Which side is usually chosen as build side?',['The smaller relation','The relation with more tuples','Always the left relation'],0,'The smaller input is likelier to fit.']],lab:'memory'},
{id:'bnlj',week:8,chapter:15,title:'3. Block nested-loop join',subtitle:'Batch outer blocks so the inner relation is not rescanned for every tuple.',objective:['Write the block-NLJ formula','Reserve the correct buffers','Compare both orientations'],concept:'Tuple nested-loop revisits the inner relation for every outer tuple. Block nested-loop holds a chunk of the outer relation in memory and scans the inner relation once per chunk. Direction matters: the outer relation determines the number of inner scans.',analogy:'Instead of carrying one card at a time to compare with another deck, place a hand of cards on the desk and scan the deck once for that batch.',terms:[['Outer R','Relation divided into memory-sized batches.'],['Inner S','Rescanned once for each outer batch.'],['M−1','Up to M−1 outer blocks per batch; one block is read from the inner relation.'],['ceil','A final partial batch still triggers a full inner scan.']],formula:'Block-NLJ (R outer, S inner): B(R)+ceil(B(R)/(M−1))·B(S)',procedure:['Try both orientations, using each candidate outer relation.','Compute batch capacity M−1.','Compute outer batches: ceil(B(outer)/(M−1)).','Read the outer once; multiply inner blocks by batch count.','Choose the cheaper orientation and state which relation is outer.'],workedTitle:'Textbook Example 15.4 and Exercise 15.3.2',worked:['Example 15.4 uses B(R)=1,000, B(S)=500, M=101. The textbook buffers S as the smaller outer relation in five 100-block chunks: 5×(100+1,000)=5,500 I/Os. Reversing roles costs 6,000.','Exercise 15.3.2 asks the nested-loop cost for both inputs 10,000 blocks and M=1,000.','M−1=998; ceil(10,000/998)=11 batches; cost=10,000+11×10,000=120,000 I/Os.','The textbook calls this nested-loop (nested-block) join; it is not tuple-at-a-time NLJ. The Week 8 Tutorial 5 formula uses M−1 outer buffers too.'],book:{cite:'Textbook Chapter 15 §15.3, Example 15.4 and Exercise 15.3.2 (exercise data paraphrased, answer derived).',prompt:'B(R)=B(S)=10,000 blocks, M=1,000. Using R as outer, estimate block-NLJ I/Os.',answer:120000,unit:'I/Os',hint:'M−1=998; ceil(10,000/998)=11 batches.',solution:'10,000+11×10,000=120,000 I/Os, under the M−1 buffer convention.'},practice:{prompt:'B(outer)=1,000, B(inner)=200, M=102. Enter block-NLJ cost.',answer:3000,unit:'I/Os',explain:'Capacity=101; batches=ceil(1,000/101)=10; cost=1,000+10×200=3,000.'},quiz:[['For block-NLJ, the inner relation is rescanned…',['once per outer batch','once per outer tuple','only after sorting'],0,'Number of scans equals outer batch count.'],['With M=102, common outer batch capacity is…',['102','101','100'],1,'One block is used to read the inner relation, leaving M−1=101 outer blocks.']],lab:'bnlj'},
{id:'sort',week:7,chapter:15,title:'4. External merge sort (TPMMS)',subtitle:'Create initial runs, then merge them; count passes and I/Os before using sort-based operators.',objective:['Compute initial runs and merge fan-in','Test two-pass feasibility','Distinguish pipelined from materialized output'],concept:'When a relation exceeds memory, external merge sort sorts M blocks at a time into initial runs, then merges up to M−1 runs per pass. Two-pass sorting works when all initial runs fit in one merge pass; bigger inputs need more passes.',analogy:'Sort a huge stack of papers by making desk-sized piles first, then merge piles while keeping one page from each run visible.',terms:[['Initial run','Sorted chunk created from up to M input blocks.'],['Fan-in','At most M−1 runs merged; one buffer/run plus output.'],['Pass','Full read/write phase over the data.'],['TPMMS','Two-Phase Multiway Merge-Sort.']],formula:'r₀=ceil(B/M); fan-in=M−1. Two-pass bound: B≤M(M−1) (≈M²). Cost: 3B if pipelined output; 4B if final sorted file materialized.',procedure:['Record B and available buffers M.','Create r₀=ceil(B/M) initial runs.','Check r₀≤M−1; if false, count further merge passes.','Count reads and writes for each pass.','Do not count a final write when the sorted stream is pipelined.'],workedTitle:'Textbook Example 15.5 and two-pass feasibility',worked:['Let M=100, B=9,800. Initial runs=ceil(9,800/100)=98.','Merge fan-in=99; 98 runs merge in one final pass, so two-pass sort is feasible.','Pipelined output cost=3×9,800=29,400 I/Os; materialized output=4×9,800=39,200.','At B=10,000, 100 initial runs exceed fan-in 99, so an extra merge pass is needed.'],book:{cite:'Textbook Chapter 15 §15.4.1, Example 15.5; Exercise 15.4.2 supplies B(R)=B(S)=10,000, M=1,000 for sort-based operations.',prompt:'Using the exercise’s B=10,000 and M=1,000 data, can each input be sorted in two passes?',answer:'yes',hint:'There are ceil(10,000/1,000)=10 initial runs; compare with M−1=999.',solution:'Yes. Each input creates 10 initial runs, fewer than 999-way merge capacity. This answers the feasibility part; the exercise also compares set-union and join costs.'},practice:{prompt:'B=20,000, M=200. How many initial runs?',answer:100,unit:'runs',explain:'ceil(20,000/200)=100 initial runs; fan-in is 199, so one merge pass suffices.'},quiz:[['A merge pass can combine at most…',['M runs','M−1 runs','M+1 runs'],1,'One buffer is reserved for output.'],['If the two-pass sorted output is pipelined, textbook cost is…',['2B','3B','4B'],1,'Read input/write runs, then read runs; no final output write.']],lab:'sort'},
{id:'setops',week:7,chapter:15,title:'5. Sort-based set operations & duplicate elimination',subtitle:'Use sorted order to make duplicates adjacent, then merge with pointers.',objective:['Explain why sorting exposes duplicates','Trace a merge of sorted inputs','Track set versus bag semantics'],concept:'Sorting groups equal tuples together, so one pass can retain one representative or merge two ordered inputs for union/intersection/difference. Sorting is usually the expensive part; the merge itself is sequential.',analogy:'Alphabetize two guest lists. Duplicates line up beside each other, so one comparison pass can merge them.',terms:[['Duplicate elimination','Keep one tuple from each equal-value run.'],['Set semantics','One copy of each value in a set result.'],['Merge','Advance the smaller current key; handle equal keys by the operation.'],['Bag semantics','Duplicate multiplicity may be preserved.']],formula:'Sort on all attributes needed for equality/set comparison; then merge each sorted input once. Add final result writes only if materialized.',procedure:['Check whether the question uses set or bag semantics.','Choose the sort key: all tuple attributes for duplicate elimination, comparison attributes for set ops.','Sort inputs or exploit existing sorted order.','Merge with two pointers; state what happens on equality.','Add final output writes only if requested.'],workedTitle:'A two-pointer union trace',worked:['Sorted R: 1,2,2,5; sorted S: 2,3,5.','At 1, emit 1. At equal 2, emit one 2 and advance past both copies.','Then emit 3; at equal 5, emit one 5. Result={1,2,3,5}, four distinct values.','The merge is linear in input size; sorting and output policy dominate I/O.'],book:{cite:'Textbook Chapter 15 §15.4, set-operation algorithms; Exercise 15.4.2 compares set union with simple/effective sort-join. The pointer trace here is tutor-authored practice.',prompt:'Sorted R has key 4 and sorted S has key 7. In a set union, what do you do next?',answer:'emit 4 advance R',hint:'The smaller key appears only in R now.',solution:'Emit 4 once and advance R; S stays at 7 until its key is consumed.'},practice:{prompt:'R={1,2,2,4}, S={2,3,4}. How many distinct values are in their union?',answer:4,unit:'values',explain:'The union is {1,2,3,4}, so there are four distinct values.'},quiz:[['Sorting helps duplicate elimination because…',['equal tuples become adjacent','the relation has fewer attributes','M increases'],0,'Equal tuples can be removed in one sequential pass.'],['In a sorted set union, equal current keys are usually…',['emitted twice','emitted once','both discarded'],1,'Set union emits one copy.']],lab:'merge'},
{id:'sortjoin',week:7,chapter:15,title:'6. Sort-merge join: simple vs efficient',subtitle:'Separate sorting I/O from the merge, then test duplicate-group memory limits.',objective:['Compute simple and efficient sort-join costs','Check feasibility and duplicate-group limits','Explain why the variants differ'],concept:'Sort-merge join sorts both relations on the join attributes, then scans them together. A simple form materializes sorted relations; an efficient form pipelines the final sort merge into the join when feasible. A huge group of equal keys can exceed memory and require a fix-up.',analogy:'Sort two queues by ticket number. Advance the smaller number; match equal-key groups. A huge crowd with one number may not fit in your working area.',terms:[['Join key','Attribute(s) compared for equality.'],['Simple sort-join','Materialize sorted files, then reread them to join.'],['Efficient sort-join','Pipeline the final sort merge into the join.'],['Duplicate group','Tuples sharing a key; may exceed M.']],formula:'Example 15.6 simple: 4(BR+BS) to sort/materialize + (BR+BS) merge. Example 15.7 efficient: 3(BR+BS), under its feasibility conditions.',procedure:['Verify sort feasibility for both inputs.','Sort both on join key or exploit existing ordering.','Merge: advance smaller key; on equality, form matching groups.','Check whether a same-key group fits memory.','Add output-write I/O only if result is materialized.'],workedTitle:'Textbook Examples 15.6 and 15.7',worked:['BR=1,000, BS=500, M=101. Simple sort-join=4×1,500+1,500=7,500 I/Os.','Efficient sort-join=3×1,500=4,500 I/Os when feasibility conditions hold.','The 3,000-I/O difference comes from avoiding sorted intermediate materialization/rereading.','A same-key group larger than memory breaks the simple in-memory group assumption.'],book:{cite:'Textbook Chapter 15 §§15.4.6–15.4.8, Examples 15.6–15.7; Exercise 15.4.2 compares variants.',prompt:'For BR=1,000 and BS=500, calculate efficient sort-join cost under the textbook assumptions.',answer:4500,unit:'I/Os',hint:'Use 3(BR+BS).',solution:'3×(1,000+500)=4,500 I/Os; the simple variant is 7,500.'},practice:{prompt:'BR=700, BS=300. Under efficient sort-join assumptions, enter 3(BR+BS).',answer:3000,unit:'I/Os',explain:'3×(700+300)=3,000 I/Os.'},quiz:[['Efficient sort-join saves I/O mainly by…',['avoiding sorted intermediate materialization/rereading','using an unclustered index','skipping the merge'],0,'The final sort merge can feed the join.'],['A huge duplicate group matters because…',['it may not fit in memory','it changes the join key','it removes all matches'],0,'A large group may require extra I/O/fix-up.']],lab:'sortjoin'},
{id:'grace',week:7,chapter:15,title:'7. Grace (two-pass) hash join',subtitle:'Partition both inputs on the join key, then join corresponding partitions.',objective:['Trace partition and join phases','Use 3(BR+BS) estimate','Check smaller-partition feasibility'],concept:'Grace hash join has two phases. First, hash-partition both relations so tuples with equal join keys land in matching buckets. Second, load one bucket of the smaller relation and probe with its partner bucket. Partition hash and in-memory join hash are different steps.',analogy:'Sort two decks into matching colored bins using the same rule. Compare red with red, blue with blue; matching cards cannot be in different bins.',terms:[['Partition','Write tuples to disk buckets using a hash function.'],['Corresponding buckets','Rᵢ and Sᵢ share a partition number.'],['Build/probe','In-memory hash table on one bucket; probe with its partner.'],['Skew','Uneven bucket sizes may violate expected fit.']],formula:'Standard two-pass Grace hash join: 3(B(R)+B(S)) I/Os; approximate feasibility min(B(R),B(S))<M².',procedure:['Read and partition both relations: one read and one write each.','Check expected smaller bucket size against memory.','For each bucket pair, build on smaller bucket and probe the other.','Count second-phase reads; join only corresponding bucket pairs.','State uniform distribution assumption and warn about skew.'],workedTitle:'Textbook Example 15.8',worked:['BR=1,000, BS=500, M=101. The book uses 100 buckets; average bucket sizes are 10 and 5 blocks.','Cost=3×(1,000+500)=4,500 I/Os: read/write partitions, then read them to join.','The smaller bucket is well below memory in this example.'],book:{cite:'Textbook Chapter 15 §15.5.5, Example 15.8; the section gives approximate feasibility min(BR,BS)<M².',prompt:'Use the textbook standard Grace-hash cost for BR=1,000 and BS=500.',answer:4500,unit:'I/Os',hint:'There are three full relation-size I/O phases.',solution:'3×(1,000+500)=4,500 I/Os, assuming uniform partitions and feasible buckets.'},practice:{prompt:'BR=2,400, BS=600. Enter standard Grace-hash join I/Os.',answer:9000,unit:'I/Os',explain:'3×(2,400+600)=9,000 I/Os.'},quiz:[['Why do matching tuples land in corresponding bucket pairs?',['Both relations use the same hash on join keys','They have equal tuple counts','The buffer manager sorts them'],0,'Equal keys hash to the same partition.'],['Standard two-pass hash-join cost is…',['2(BR+BS)','3(BR+BS)','4(BR+BS)'],1,'Read/write partitions, then reread to join.']],lab:'hash'},
{id:'hybrid',week:7,chapter:15,title:'8. Hybrid hash join & the two-answer trap',subtitle:'Keep selected buckets in memory; distinguish textbook Example 15.9 from the lecture answer.',objective:['Explain which I/O phases are saved','Use the textbook approximation carefully','Keep official lecture and textbook examples separate'],concept:'Hybrid hash join retains one or more smaller-side buckets in memory. Tuples of the corresponding bucket on the other relation are joined immediately. Those partitions are not written and reread. Savings depend on how much stays in RAM and bucket-size rounding.',analogy:'While sorting cards into bins, keep one complete bin on your desk. Matching cards arriving for that bin are processed immediately instead of filed and retrieved later.',terms:[['In-memory partition','Smaller-side bucket retained during partitioning.'],['Saved I/O','Avoid a write and a later read for retained data.'],['Bucket count k','Too few buckets can leave inadequate buffer space.'],['Version warning','Textbook Example 15.9 differs from the instructor’s Week 7 example.']],formula:'Textbook approximation: (3−2M/B(S))·(B(R)+B(S)), S=smaller input. Exact bucket reservations/rounding alter the estimate.',procedure:['Choose smaller relation S as build side.','Estimate buckets and buffers for retained bucket plus other bucket buffers.','Partition S; retain selected bucket(s), write the rest.','Partition R; immediately join tuples mapping to retained buckets.','Read/join only disk-resident corresponding buckets; compare saved I/Os.'],workedTitle:'Textbook Example 15.9 — not the lecture Q5 answer',worked:['BR=1,000, BS=500, M=101. The textbook selects k=6 and keeps one smaller-side bucket in memory.','It writes 5/6 of each relation and reports 4,000 I/Os (versus 4,500 for Grace).','The simple approximation gives about 3,894; explicit bucket accounting yields the textbook 4,000.','Week 7 class has a separate official hybrid example/result of 30,048 I/Os. Do not replace that answer with Example 15.9.'],book:{cite:'Textbook Chapter 15 §15.5.6, Example 15.9; Exercise 15.5.2 asks for both inputs 10,000 blocks and M=1,000.',prompt:'What cost does textbook Example 15.9 report for BR=1,000, BS=500, M=101?',answer:4000,unit:'I/Os',hint:'The book uses k=6 and writes five of six buckets.',solution:'4,000 I/Os, 500 fewer than standard Grace’s 4,500 for these inputs. This is the textbook bucket-accounted result, separate from the class’s 30,048.'},practice:{prompt:'Relative to Grace, retaining a bucket avoids which two actions? Enter “write and read”.',answer:'write and read',explain:'The retained partition is not written to disk or read back in the second phase.'},quiz:[['Hybrid hash saves I/O by…',['keeping selected buckets in memory','hashing with random keys','writing all buckets sorted'],0,'Retained buckets bypass a disk write and later read.'],['The book’s 4,000-I/O result belongs to…',['Week 7 class exercise','Textbook Example 15.9','Week 9 histogram'],1,'Keep source-specific results separate.']],lab:'hybrid'},
{id:'scans',week:8,chapter:15,title:'9. Table, index, bitmap & zone-map scans',subtitle:'Choose how to find candidate tuples, then count data-page reads.',objective:['Compare table-scan and index-scan','Know how bitmaps and zone maps prune pages','Explain why physical layout matters'],concept:'Table-scan reads every relation block in storage order. Index-scan follows pointers to candidate records/pages or returns ordered tuples. Bitmap indexes combine candidate row IDs; zone maps store per-region summaries such as min/max and skip pages that cannot match. An index is not automatically cheaper.',analogy:'A table-scan reads every box; an index is a catalogue, a bitmap is a row-location mask, and a zone map is a label that lets you skip boxes whose values cannot match.',terms:[['Table-scan','Read all B(R) data blocks.'],['Index-scan','Follow index entries/pointers to candidate records/pages.'],['Bitmap','Bit vectors combined with AND/OR to mark candidates.'],['Zone map','Per-region min/max or summary used to skip impossible blocks.'],['Locality','Qualifying records may share pages or be scattered.']],formula:'Full scan≈B(R). Index path≈tree traversal + data-page fetches; bitmap/zone-map savings depend on selectivity and clustering.',procedure:['Identify equality, range, or combined predicates.','Estimate qualifying tuples and pages, not only distinct values.','Check access structures and clustering.','Estimate index traversal plus heap-page reads.','Compare with B(R) and state bitmap/zone-summary assumptions.'],workedTitle:'Simple scan comparison',worked:['R occupies 1,000 blocks. A full table-scan costs about 1,000 page reads.','A predicate returns 30% of tuples scattered across pages; an unclustered index may fetch nearly every page.','If a bitmap combination identifies 180 pages, bitmap plus 180 heap fetches may win.','A zone map excluding 70% of pages leaves at most 300 candidate pages.'],book:{cite:'Textbook Chapter 15 §§15.1.1–15.1.2 and §15.6.2; Week 8 lecture covers bitmap and zone-map scan examples.',prompt:'R has 1,000 blocks. How many data-block reads does a full table-scan use?',answer:1000,unit:'reads',hint:'A full scan touches every block.',solution:'About 1,000 data-block reads; index/summary overhead is separate.'},practice:{prompt:'A zone map rules out 25% of 800 blocks. How many candidate blocks remain?',answer:600,unit:'blocks',explain:'75% of 800 remain: 600 candidate blocks.'},quiz:[['A zone map skips a page when…',['its summary rules out the predicate','the query is equality','the table has no index'],0,'Per-region summaries prune impossible blocks.'],['An unclustered index may lose to scan because…',['qualifying records are scattered over many pages','indexes cannot serve equality','table-scan is per tuple'],0,'Random data-page fetches may approach a full scan.']],lab:'scan'},
{id:'indexselect',week:8,chapter:15,title:'10. Clustered vs unclustered index selections',subtitle:'Estimate equality/range costs and derive when an index beats a table-scan.',objective:['Use V(R,A) for equality selection','Distinguish clustered and unclustered fetches','Derive index-versus-scan threshold'],concept:'For A=c, uniformity predicts T(R)/V(R,A) matching tuples. A clustering index keeps equal-key tuples together, so they occupy about B(R)/V pages. An unclustered index may need one I/O per matching tuple. Compare either estimate with a B(R)-block scan.',analogy:'If matching books are shelved together, one trip reaches a stack. If scattered, you may need one trip per book.',terms:[['Clustered index','Equal-key tuples are physically near each other.'],['Unclustered index','Matching tuples may be scattered.'],['Equality selectivity','≈1/V(R,A), under uniformity.'],['Range selectivity','Fraction of values in the interval; histogram improves it.']],formula:'Equality: clustered≈max(1,ceil(B/V)); unclustered≈max(1,ceil(T/V)); compare each with B(R).',procedure:['Estimate matching tuples T/V (uniformity assumption).','For clustered index, convert matches to pages; use B/V.','For unclustered index, count scattered matching tuple fetches.','Add index traversal if required.','Compare with B(R); state break-even condition.'],workedTitle:'Textbook Exercise 15.6.2: cost as a function of k',worked:['B(R)=10,000, T(R)=500,000, V(R,a)=k.','Clustered equality estimate≈10,000/k I/Os; unclustered≈500,000/k.','A table-scan costs 10,000. The unclustered index beats it if 500,000/k<10,000, or k>50.','Index-tree overhead and page locality are omitted as the exercise allows.'],book:{cite:'Textbook Chapter 15 §§15.6.1–15.6.2; Exercises 15.6.2–15.6.4 cover equality/range costs and scan thresholds.',prompt:'Using Exercise 15.6.2’s unclustered equality estimate, for what k does the index beat a 10,000-I/O scan?',answer:'k>50',hint:'Solve 500,000/k<10,000.',solution:'k>50; k=50 ties under the simplified model. Index traversal overhead is excluded.'},practice:{prompt:'T=120,000, V=600, unclustered equality index. Estimate matching tuple-fetch I/Os.',answer:200,unit:'I/Os',explain:'T/V=120,000/600=200 matching tuple fetches.'},quiz:[['For equal selectivity, which layout usually fetches fewer data pages?',['clustered','unclustered','neither reads data'],0,'Clustered matches share pages.'],['T=500,000, V=100: unclustered estimate is…',['5,000','50,000','500,000'],1,'T/V=5,000 matching tuples.']],lab:'index'},
{id:'inlj',week:8,chapter:15,title:'11. Index nested-loop join',subtitle:'For each outer tuple, probe an inner index; decide when repeated lookups are affordable.',objective:['Write clustered/unclustered INLJ formulas','Choose a useful outer relation','Interpret the 51,000-I/O example'],concept:'Index nested-loop join scans the outer relation; each outer tuple probes an inner index for matches. It is attractive when outer is small or few keys are visited. A large outer input with many matching inner tuples can be much worse than hash/sort join.',analogy:'Look up each guest on a short list in a directory. Fast for a short list; costly if you look up everyone in a stadium.',terms:[['Outer R','Relation scanned to generate lookup keys.'],['V(S,Y)','Distinct inner join-key values in S.'],['Clustered index','Same-key matches occupy fewer pages.'],['Index overhead','Root/leaf I/Os may be added; textbook example neglects them.']],formula:'Clustered: B(R)+T(R)·max(1,B(S)/V(S,Y)); unclustered: B(R)+T(R)·T(S)/V(S,Y).',procedure:['Choose outer relation; record B(outer), T(outer).','Confirm index on inner join attribute.','Estimate matching tuples/key as T(inner)/V(inner,Y).','Convert to pages if clustered; otherwise count scattered tuple fetches.','Compare with scan/hash/sort join and include index I/O if requested.'],workedTitle:'Textbook Example 15.12: an expensive index join',worked:['B(R)=1,000; B(S)=500; T(R)=10,000; T(S)=5,000; V(S,Y)=100.','With clustered R and clustering index on S.Y: 1,000+10,000×(500/100)=51,000 I/Os.','This exceeds the 4,500-I/O Grace/sort examples for the same sizes.','Exercise 15.6.5 shows why filtering “King Kong” first can make R tiny and change the decision.'],book:{cite:'Textbook Chapter 15 §15.6.3, Example 15.12; Exercise 15.6.5 applies “King Kong” selection before an index join.',prompt:'For Example 15.12, use 1,000+10,000×500/100. What is the cost?',answer:51000,unit:'I/Os',hint:'Simplify 500/100 first.',solution:'1,000+10,000×5=51,000 I/Os, excluding index traversal.'},practice:{prompt:'Outer B=50,T=200; inner clustered index has B=600,V=30. Enter INLJ estimate.',answer:4050,unit:'I/Os',explain:'50+200×max(1,600/30)=50+200×20=4,050.'},quiz:[['INLJ is most promising when…',['outer is small and inner index exists','both inputs huge and no index','inner index always unclustered'],0,'Few outer probes limit repeated lookups.'],['For unclustered index, matches are often costed as…',['T(S)/V(S,Y) pages per key','B(S)/V(S,Y) pages per key','zero reads'],0,'Scattered matches may need one fetch per tuple.']],lab:'inlj'},
{id:'zigzag',week:8,chapter:15,title:'12. Sorted-index & zig-zag joins',subtitle:'Use ordered index leaves to skip unmatched keys without fetching full tuples.',objective:['Trace two ordered key streams','Know which tuples must be fetched','Compare one sorted index with two'],concept:'If an index returns tuples in join-key order, it may replace a sort. With indexes on both inputs, a zig-zag join advances through ordered key streams. If one key is smaller, it cannot match the current larger key; skip it without fetching its tuple. Retrieve full tuples only for common key groups.',analogy:'Two sorted queues: advance the smaller ticket number. Pull people out only when the ticket numbers match.',terms:[['Leaf scan','Traverse B+ tree leaves in key order.'],['Unmatched key','May be skipped without fetching full tuple.'],['Common group','All tuples on both sides with same key.'],['Fix-up','Extra work if duplicate group exceeds memory.']],formula:'One sorted index: sort the other input + merge. Two sorted indexes: scan key streams + fetch common groups; count index and data reads.',procedure:['Start at first key in each index.','If Rkey<Skey advance R; if Skey<Rkey advance S.','If equal, fetch all tuples for that key on both sides and join.','Skip beyond both duplicate groups and repeat.','Count index traversal/data fetches; do not charge skipped tuples as full data reads.'],workedTitle:'Textbook Example 15.13: zig-zag trace',worked:['R keys: 1,3,4,4,4,5,6. S keys: 2,2,4,4,6,7.','Skip R=1; advance S past both 2s; skip R=3.','At 4, retrieve and join both key groups. Skip 5; match 6. R ends, so stop.','Only common key groups 4 and 6 need full tuple retrieval in this trace.'],book:{cite:'Textbook Chapter 15 §15.6.4, Examples 15.13–15.14; Example 15.14 reports 3,500 I/Os with R sorted and a sorted S index.',prompt:'For the Example 15.13 key streams, list the common join keys.',answer:'4 6',hint:'Advance the smaller current key until fronts match.',solution:'Common keys are 4 and 6; unmatched 1,2,3,5,7 can be skipped.'},practice:{prompt:'R keys 1,4,9; S keys 2,4,7,9. How many distinct key groups match?',answer:2,unit:'groups',explain:'Common keys are 4 and 9: two groups.'},quiz:[['If current R key is smaller, the scan should…',['advance R','advance S','fetch both full tuples'],0,'R’s key cannot match current or later S keys.'],['Two ordered index streams can avoid fetching…',['unmatched tuples','matching tuples','all index leaves'],0,'Unmatched keys are skipped by order.']],lab:'zigzag'},
{id:'compiler',week:9,chapter:16,title:'13. Query compiler: SQL to physical plan',subtitle:'Separate syntax, logical meaning, optimization, physical algorithms, and execution.',objective:['Name compilation stages in order','Distinguish logical from physical plans','Explain where statistics matter'],concept:'A DBMS compiles declarative SQL into executable operators. Parsing builds a syntax tree; semantic checking validates names/types; translation produces a logical relational-algebra plan; rewrites improve it; physical-plan generation selects access methods, algorithms, join order, and data flow.',analogy:'A travel request is not a route. Understand the request, list the stops, reorder safe tasks, choose tools, then decide whether steps can run in parallel.',terms:[['Parse tree','Structure of SQL syntax.'],['Semantic check','Resolve relation/attribute names and types.'],['Logical plan','Relational-algebra expression independent of physical algorithms.'],['Physical plan','Concrete scans, joins, algorithms, ordering, and data flow.'],['Metadata','Sizes, V, histograms, indexes, and storage layout.']],formula:'SQL → parse/semantic checks → logical plan → algebraic rewrites → physical plan → execution',procedure:['Identify SQL result and dependencies.','Draw initial logical operators.','Apply only semantics-preserving transformations.','Use statistics to estimate intermediates and compare plans.','Choose physical operators; label materialization/pipelining.'],workedTitle:'Translate a query into plan skeleton',worked:['SQL: SELECT name FROM Student WHERE year=3.','Logical: π_name(σ_year=3(Student)).','Physical choices: table-scan+filter, or index-scan on year+filter, then projection.','Logical plan says what; physical plan says how.'],book:{cite:'Textbook Chapter 16 §16.1, printed pp.760–767; Chapter 15 preview separates compilation and execution.',prompt:'Which plan specifies “B+ tree index scan on year” and “hash join”?',answer:'physical',hint:'Logical algebra does not specify an access method.',solution:'The physical query plan names concrete scans and join algorithms.'},practice:{prompt:'σ_year=3(Student) does not specify any index. Is it logical or physical?',answer:'logical',explain:'It names an algebraic operation but no physical access algorithm.'},quiz:[['Which stage checks names and types?',['semantic checking','hash partitioning','physical scan'],0,'Semantic analysis resolves attributes and types.'],['An algebra expression without an access method is…',['logical','physical','executed'],0,'No physical implementation is selected yet.']],lab:'compiler'},
{id:'rewrite',week:9,chapter:16,title:'14. Algebraic rewrites & predicate pushdown',subtitle:'Move safe filters early, then explain why fewer tuples flow into later operators.',objective:['Apply selection/projection pushdown','Check attribute dependencies','Explain correctness and cost benefit'],concept:'Relational-algebra laws let an optimizer rearrange operations without changing the result. Selection pushdown applies a filter near a base relation so fewer tuples reach later joins. Projection pushdown removes unused columns, but every attribute needed for later predicates or joins must remain.',analogy:'Remove items that fail inspection and discard unneeded packaging—but keep labels needed to route the remaining boxes.',terms:[['σ selection','Filter rows using a predicate.'],['π projection','Keep specified columns.'],['Pushdown','Move a safe operator closer to its input.'],['Predicate','Boolean condition in a selection.'],['Join key','Attribute that must survive projection for matching.']],formula:'If c references only R: σc(R⋈S) ≡ σc(R)⋈S, subject to semantics. Projection pushdown must retain join keys and output attributes.',procedure:['Mark which relation(s) each predicate references.','Push it below a join only when it uses a single input and equivalence holds.','Keep future join keys and required output columns.','Estimate smaller intermediate cardinality.','Compare candidate costs; equivalence does not guarantee same execution cost.'],workedTitle:'Selection-pushdown plan rewrite',worked:['Join Orders and Customer, then filter customers from region “East”.','Because region belongs only to Customer, rewrite σ_region=East(Orders⋈Customer) to Orders⋈σ_region=East(Customer).','The filtered Customer input is smaller; keep the join key.','If a predicate uses both relations, it cannot be pushed to only one side.'],book:{cite:'Textbook Chapter 16 §§16.2–16.3, printed pp.768–791; plan transformations and equivalence.',prompt:'A filter references only attributes of R in R⋈S. Where can the selection move?',answer:'below R',hint:'Push it to the input whose attributes it uses.',solution:'Below the join on R: σc(R⋈S)≡σc(R)⋈S, subject to the operator semantics.'},practice:{prompt:'R has 1,000 tuples; a pushed filter retains 10%. How many R tuples enter the join?',answer:100,unit:'tuples',explain:'1,000×0.10=100 tuples enter the join.'},quiz:[['Pushdown is useful because it often…',['shrinks later inputs','increases columns','changes semantics'],0,'Fewer tuples/columns can reduce downstream work.'],['Projection below a join must retain…',['join attributes','only final display attributes','no attributes'],0,'The join keys are needed to form matches.']],lab:'rewrite'},
{id:'cardinality',week:9,chapter:16,title:'15. Cardinality: selections, joins & assumptions',subtitle:'Estimate intermediate sizes from tuple counts and distinct-value statistics.',objective:['Estimate equality selection','Estimate join output','Name uniformity/independence assumptions'],concept:'The optimizer estimates intermediate cardinalities from relation sizes and statistics. These estimates guide plan comparison. A small error early can multiply through later joins, so show assumptions and units.',analogy:'Estimate how many diners choose each dish. If you guess the crowd wrong, the shopping plan—and later combinations—will be wrong.',terms:[['Cardinality','Tuple count in a relation/result.'],['Selectivity','Fraction of input tuples expected to pass.'],['Uniformity','Values assumed equally common.'],['Independence','Predicates assumed statistically independent.'],['Containment','One side’s join values assumed covered by the other.']],formula:'Equality: T(σA=c(R))≈T(R)/V(R,A). Join: T(R⋈S)≈T(R)T(S)/max(V(R,A),V(S,A)), under common assumptions.',procedure:['Write T(R), T(S), and relevant V values.','Estimate each selection; combine AND/OR using stated independence.','For join, use distinct counts for matching attributes.','Carry each output estimate into the next operator.','State assumptions; round at the end unless directed.'],workedTitle:'Apply join-cardinality estimate',worked:['T(R)=2,000; T(S)=3,000; V(R,a)=100; V(S,a)=150.','Estimate 2,000×3,000/max(100,150)=40,000 tuples.','If both distinct counts are 100, estimate 60,000.','This is an estimate; skew/correlation can change actual output.'],book:{cite:'Textbook Chapter 16 §16.4, printed pp.792–802; Examples 16.20 and 16.23–16.26 cover layout/cardinality estimates.',prompt:'Estimate equality selection size for T(R)=10,000 and V(R,A)=100 under uniformity.',answer:100,unit:'tuples',hint:'Divide T by V.',solution:'10,000/100=100 tuples.'},practice:{prompt:'T(R)=12,000; V(R,A)=300. Estimate T(σA=c(R)).',answer:40,unit:'tuples',explain:'12,000/300=40 under uniformity.'},quiz:[['Equality estimate T/V assumes…',['uniform distribution','all rows share one page','infinite M'],0,'Uniformity gives average frequency T/V.'],['Cardinality estimates help…',['compare candidate plans','prove exact output','avoid metadata'],0,'Estimated sizes guide cost and join order.']],lab:'cardinality'},
{id:'histogram',week:9,chapter:16,title:'16. Histograms, skew & sampling',subtitle:'Replace a uniform guess with frequency information when values are uneven.',objective:['Read bucket frequencies','Estimate equality/range selectivity','Explain how skew changes plans'],concept:'Distinct-value counts give only average frequency. Histograms store frequencies by value/range, improving estimates for hot values and intervals. Sampling estimates statistics from a subset, with uncertainty.',analogy:'An average says every bus stop has the same crowd. A histogram reveals two crowded stops and several nearly empty ones.',terms:[['Histogram bucket','Range/value group with estimated frequency.'],['Skew','Unequal value frequencies.'],['Sampling','Estimate statistics from a subset.'],['Range selectivity','Fraction of tuples inside a value interval.']],formula:'Histogram estimate: sum frequencies of buckets/values intersecting the predicate. Uniform estimate is a fallback.',procedure:['Determine equality or range predicate.','Locate intersecting bucket(s).','Sum/interpolate estimated frequencies.','Convert estimated count into cardinality for the next operator.','Flag boundary interpolation and sampling error.'],workedTitle:'Histogram lookup',worked:['Values 1–10 occur 100 times; 11–20 occur 500 times; 21–30 occur 400 times.','Range 11–20 selects 500/1,000=50%.','Uniform-per-distinct-value predicts only about 3.3% per value; the histogram shows a dense region.','Week 9 lecture join-histogram example estimates 7,314.4 tuples; this remains an estimate.'],book:{cite:'Textbook Chapter 16 §16.5, Examples 16.27–16.29; histograms and alternative-plan estimates.',prompt:'A histogram has 1,000 rows total; the queried range bucket contains 250. Estimate range selectivity.',answer:25,unit:'%',hint:'Divide bucket frequency by total and multiply by 100.',solution:'250/1,000=0.25=25% estimated selectivity.'},practice:{prompt:'A sample histogram estimates 80 matching rows out of 400 sampled. Estimate selectivity as percent.',answer:20,unit:'%',explain:'80/400=0.20=20%.'},quiz:[['A histogram helps especially when…',['values are skewed','there are no rows','there is no predicate'],0,'Frequencies capture nonuniform distributions.'],['Range estimate commonly sums…',['relevant bucket frequencies','M values','index levels only'],0,'Bucket frequencies approximate matching count.']],lab:'hist'},
{id:'access',week:10,chapter:16,title:'17. Physical selection plans & access paths',subtitle:'Cost competing table/index plans, including residual filters and clustering.',objective:['Build a candidate-plan cost table','Use indexes and residual predicates correctly','Choose cheapest feasible access path'],concept:'A selection can use a full table-scan or use an index for one conjunct and test remaining terms on fetched tuples. The most selective-looking predicate is not automatically cheapest: clustering and tuple/page costs matter. Estimate all candidates, then choose.',analogy:'A store map helps only if the products are not scattered across every aisle; sometimes walking all aisles is faster than many detours.',terms:[['Access path','Method to reach candidate tuples.'],['Residual filter','Predicate tested after index retrieval.'],['Clustered index','Matching tuples occupy fewer pages.'],['Cost table','Side-by-side estimates for alternatives.']],formula:'Compare scan B(R) with index traversal + data fetches; residual predicates add tuple tests but should not double-count page reads.',procedure:['List usable indexes and supporting predicates.','Estimate tuples/pages retrieved.','Add data fetches using clustered/unclustered assumptions.','Apply other conjuncts as residual filters.','Compare with full scan; choose lowest feasible estimate.'],workedTitle:'Textbook Example 16.35: choose the y index',worked:['T(R)=5,000, B(R)=200; x=1 AND y=2 AND z<5. Vx=100, Vy=500; all indexed, only z clustered.','Scan=200; x unclustered=5,000/100=50; y unclustered=5,000/500=10; z clustered≈200/3≈67.','Choose y index (≈10 I/Os), then test x and z as residual filters.','A clustered index on a less selective condition can lose to an unclustered index on a more selective value.'],book:{cite:'Textbook Chapter 16 §16.7.1, Example 16.35; Exercise 16.7.1 asks for physical selection plans/costs.',prompt:'In Example 16.35, which indexed predicate has the lowest estimated cost?',answer:'y',hint:'Compare 50, 10, and about 67 with a 200-block scan.',solution:'Use the y index at about 10 I/Os, then test x and z on retrieved tuples.'},practice:{prompt:'T=8,000, V(A)=200, unclustered equality index; B=500. Which is cheaper under this model: index or scan?',answer:'index',explain:'Index fetch estimate=8,000/200=40, below 500-block scan.'},quiz:[['An index on a less selective attribute may lose because…',['matching tuples occupy many pages','indexes use no disk','it always scans relation twice'],0,'Layout and clustering affect data-page cost.'],['Other conjuncts after one index can be…',['residual filters','discarded','joins'],0,'Index retrieval does not satisfy remaining predicates automatically.']],lab:'access'},
{id:'joinorder',week:10,chapter:16,title:'18. Join trees & join-order reasoning',subtitle:'Estimate intermediates and explain why equivalent join trees have different costs.',objective:['Read left-deep and bushy trees','Use intermediate cardinalities','Compare complete plan costs'],concept:'Join operations are associative/commutative, so many trees return the same logical answer. Intermediate sizes can differ greatly. The optimizer estimates each candidate intermediate and its implementation cost.',analogy:'Combining ingredients in different orders can make the work surface manageable or create an enormous pile too early.',terms:[['Join tree','Tree of pairwise join operations.'],['Left-deep','Each new relation joins prior result.'],['Bushy','Both children may be intermediate results.'],['Intermediate','Result produced before final output.']],formula:'For each candidate tree, estimate child results; cost the parent using those sizes. Logical equivalence≠equal physical cost.',procedure:['Draw relations and join predicates.','Estimate base cardinalities and distinct counts.','For each candidate first join, estimate output size.','Propagate outputs to later joins and sum the full plan.','Check predicates and required attributes are preserved.'],workedTitle:'Textbook Example 16.33: why the first join matters',worked:['Four relations each have 1,000 tuples; textbook Example 16.33 reports `((T⋈U)⋈S)⋈R` as best.','Its simplified total cost is 3,000 in the example.','If one legal first join yields 40,000 tuples and another yields 400, the latter is usually cheaper to carry forward, all else equal.','Compare total tree costs; the smallest first result alone is not a proof of global optimality.'],book:{cite:'Textbook Chapter 16 §§16.5–16.6, Example 16.33.',prompt:'The textbook’s Example 16.33 has four 1,000-tuple relations and reports a simplified best-plan cost. Enter that cost.',answer:3000,unit:'cost units',hint:'The reported grouping is ((T⋈U)⋈S)⋈R.',solution:'3,000 simplified cost units for the reported grouping `((T⋈U)⋈S)⋈R`.'},practice:{prompt:'Two legal intermediates have 40,000 and 400 tuples. Which is usually preferable to carry forward, all else equal?',answer:400,unit:'tuples',explain:'A smaller intermediate usually reduces later work, but full-plan cost decides.'},quiz:[['Equivalent join trees can have different costs because…',['intermediate sizes/access methods differ','logical answers differ','joins are not associative'],0,'Same answer, different physical work.'],['Join-order estimates must propagate…',['intermediate cardinalities','only final size','relation names'],0,'Each intermediate becomes input to later operators.']],lab:'joins'},
{id:'dp',week:10,chapter:16,title:'19. Dynamic programming vs greedy join order',subtitle:'Build best plans for subsets instead of committing to a locally cheap pair.',objective:['Describe the subset recurrence','Explain optimal substructure','Contrast DP and greedy'],concept:'Dynamic programming stores the cheapest plan for each relation subset, then builds larger subsets from smaller best subplans. Greedy commits to a local choice and may miss the globally best tree. DP uses more planning work but searches systematically within its model.',analogy:'For a road trip, save the best route for each visited-city subset, then reuse those routes. A greedy driver always takes the nearest next stop and may travel farther overall.',terms:[['Subset S','Set of base relations already joined.'],['DP state','Best plan/cost for one subset.'],['Recurrence','Try legal splits into smaller subsets.'],['Greedy','Commit to local choice without exploring future combinations.']],formula:'Best[S]=min over legal A∪B=S of Best[A]+Best[B]+Cost(join(A,B)).',procedure:['Initialize singleton subsets with base access cost/cardinality.','For subset sizes 2…k, enumerate legal partitions A,B.','Reuse saved Best[A], Best[B], estimate join cost/output.','Keep cheapest plan and tree for each subset.','Read best full-set plan; compare with greedy if asked.'],workedTitle:'Textbook Example 16.33 and Exercise 16.6.4',worked:['Example 16.33: four 1,000-tuple relations; best grouping `((T⋈U)⋈S)⋈R`, simplified total cost 3,000.','Exercise 16.6.4 gives R,U=1,000; S,T=100; distinct counts mostly 100, with S.c=T.c=10, and asks greedy vs optimal.','For the exercise, initialize singleton stats, compute every legal pair, then larger subsets. Store both cost and tree.','Do not claim a numerical answer without the exercise’s full join graph and cost assumptions; the method is the answer framework.'],book:{cite:'Textbook Chapter 16 §16.6, Example 16.33 and Exercise 16.6.4.',prompt:'What does a DP table store for each relation subset?',answer:'best plan and cost',hint:'The saved result must be reusable to extend the subset.',solution:'The cheapest plan/cost for the subset, plus its tree/cardinality information for extension.'},practice:{prompt:'Can a greedy local choice guarantee the global optimum for every join order? Answer yes or no.',answer:'no',explain:'A local choice may force expensive later intermediates.'},quiz:[['DP tries…',['legal splits of a subset','only smallest relation next','every disk block'],0,'Each subset is built from smaller subsets.'],['Greedy can fail because…',['local choices can hurt global cost','it explores all subsets','it always uses more memory'],0,'A locally best choice need not be globally best.']],lab:'dp'},
{id:'physicaljoin',week:10,chapter:16,title:'20. Choose a physical join method',subtitle:'Match sizes, indexes, order, and memory to nested-loop, hash, sort-merge, or index join.',objective:['Match algorithm strengths to query conditions','Check feasibility and data properties','Compare estimates on a common basis'],concept:'A logical join has multiple physical implementations. Nested loops work for small outer inputs; block NLJ batches blocks; hash join suits equijoins with enough memory; sort-merge suits ordered inputs; index NLJ suits a small outer and useful inner index. No method is always best.',analogy:'Find matching students by comparing every pair, grouping by ID, sorting by ID, or looking up each ID in a directory. Class size and existing organization determine the best method.',terms:[['Equijoin','Join predicate tests equality.'],['Ordering','Existing sorted data can avoid sorting.'],['Index availability','Can make repeated lookups practical.'],['Feasibility','Memory/order conditions required by an algorithm.']],formula:'Compare BNLJ orientations, sort-merge, Grace/hash, and INLJ on the same I/O assumptions; reject methods that fail memory/order constraints.',procedure:['Identify join predicate and required output order.','Record B,T,M,indexes, clustering and existing order.','Compute feasible algorithm costs.','Account for sorting/materialization and duplicate-key limits.','Choose lowest estimate and explain why alternatives lose.'],workedTitle:'Compare textbook candidates: 1,000 and 500 blocks',worked:['Grace hash=3×1,500=4,500; efficient sort-join=4,500 under assumptions; simple sort-join=7,500.','Block-NLJ at M=101 is cheapest with S outer: 5,500 I/Os (textbook Example 15.4).','Textbook index NLJ Example 15.12 is 51,000 for its tuple/value counts.','Efficient sort/hash tie here; an existing index does not guarantee an index join wins.'],book:{cite:'Textbook Chapter 15 §§15.3–15.6 and Chapter 16 §16.7.2; Examples 15.6–15.12 compare methods.',prompt:'Which is cheaper for the stated textbook cases: efficient sort-join (4,500) or Example 15.12 INLJ (51,000)?',answer:'efficient sort join',hint:'Compare totals on the same basis.',solution:'Efficient sort-join at 4,500 I/Os is cheaper than the 51,000-I/O INLJ example.'},practice:{prompt:'A tiny outer result joins to an inner relation with a selective join-key index. Which method should be costed as a candidate?',answer:'index NLJ',explain:'A small outer limits index probes; still compare with hash/sort/scan alternatives.'},quiz:[['Hash join is naturally suited to…',['equijoins','range joins only','no join key'],0,'Hash partitioning uses equality join attributes.'],['Existing sorted order can reduce…',['sort-merge join cost','matching tuple count','relation size'],0,'An already sorted input avoids a sort.']],lab:'choose'},
{id:'pipeline',week:10,chapter:16,title:'21. Pipelining vs materialization',subtitle:'Decide whether intermediates flow in memory or are written and reread.',objective:['Define pipeline and materialization','Count intermediate write/read costs','Use the textbook threshold example'],concept:'Pipelining passes tuples to the next operator as they are produced, avoiding a full intermediate file. Materialization writes the complete intermediate to disk and reads it later. It may be needed for reuse, blocking operators, or memory limits.',analogy:'Serve each dish as it is cooked (pipeline), or pack everything into containers and store it before the next course (materialize). Storage costs work but can be necessary.',terms:[['Pipeline','Producer feeds consumer without storing the full intermediate.'],['Materialize','Write full intermediate to disk, then read it later.'],['Blocking operator','May need most/all input before producing output.'],['k','Intermediate size in blocks.']],formula:'Materializing k blocks adds about 2k I/Os (write+reread); plan-specific costs are additional.',procedure:['Draw operator dependencies and identify blocking steps.','Estimate intermediate size in blocks.','Verify pipeline feasibility and memory requirements.','For materialization add one write and one reread per block.','Compare whole-plan cost and explain why materialization is needed.'],workedTitle:'Textbook Example 16.36: thresholds matter',worked:['For (R⋈S)⋈U, BR=5,000, BS=10,000, BU=10,000, M=101; k is an intermediate-size parameter.','Book estimates: k<49 →55,000; 50<k<5,000 →75,000+2k; k>5,000 →75,000+4k.','For k=100, use middle branch: 75,000+2×100=75,200 I/Os.','Choose the branch by its inequality; do not apply one formula across thresholds.'],book:{cite:'Textbook Chapter 16 §§16.7.3–16.7.5, Example 16.36.',prompt:'For Example 16.36 with k=100, which branch applies and what is the cost?',answer:75200,unit:'I/Os',hint:'100 lies between 50 and 5,000; use 75,000+2k.',solution:'75,000+2×100=75,200 I/Os.'},practice:{prompt:'Materializing a 300-block intermediate adds approximately how many I/Os for write plus reread?',answer:600,unit:'I/Os',explain:'300-block write + 300-block reread=600 I/Os.'},quiz:[['Materializing k blocks commonly adds…',['k','2k','4k'],1,'One write plus one reread.'],['Pipelining is feasible when…',['operators can directly pass results and memory allows','every operator sorts','the result is empty'],0,'Blocking operators and memory limits may force materialization.']],lab:'pipeline'}

function renderEquations(content){
  const formula=content.querySelector('.mathFormula'),status=content.querySelector('.mathStatus');
  if(!formula||!status)return;
  if(!window.katex||typeof window.katex.render!=='function'){
    status.textContent='KaTeX did not load; check public/assets/katex/katex.min.js.';
    return;
  }
  const wrapped=formula.textContent.trim();
  const source=wrapped.startsWith('\\[')&&wrapped.endsWith('\\]')?wrapped.slice(2,-2).trim():wrapped;
  try{
    window.katex.render(source,formula,{displayMode:true,throwOnError:true});
    if(!formula.querySelector('.katex-html'))throw new Error('KaTeX produced no visible HTML output.');
    status.textContent=formula.scrollWidth>formula.clientWidth+2?'Equations rendered. Swipe/scroll sideways to see the full equation.':'Equations rendered.';
  }catch(error){
    formula.textContent=source;
    status.textContent=`Equation render failed: ${error.message}`;
    console.error('KaTeX equation rendering failed',error);
  }
}

function quizItems(l){return [...l.quiz,['Before calculating, what should you establish?',['Known quantities, units and assumptions','Round everything down','Ignore output policy'],0,'List inputs and check assumptions before substituting into a formula.']]}
function quiz(l){let q=quizItems(l),show=quizIndex<q.length;return `<div class="card"><div class="quizcounter">Checkpoint ${Math.min(quizIndex+1,q.length)} / ${q.length} · pass at 2 / 3</div><h2>${show?esc(q[quizIndex][0]):'Checkpoint result'}</h2>${show?q[quizIndex][1].map((x,i)=>`<button class="quizopt" data-qopt="${i}">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join(''):`<div class="quizsummary"><strong>${quizScore} / ${q.length}</strong><p>${quizScore>=2?'Passed. Now solve the transfer problem.':'Review explanations and retry; you need at least 2 correct.'}</p>${quizScore>=2?'<button class="btnprimary" id="quizContinue">Continue to transfer practice</button>':'<button id="quizRetry" class="btnprimary">Retry checkpoint</button>'}</div>`}<div id="quizExplain" class="callout" style="display:none"></div></div>`}
function transfer(l){return `<div class="card"><h2>Transfer problem</h2><p>${esc(l.practice.prompt)}</p><div class="answerrow"><input id="transferAnswer" placeholder="Solve on paper, then enter" autocomplete="off"><span>${esc(l.practice.unit||'')}</span><button id="checkTransfer" class="btnprimary">Check solution</button></div><div id="transferFeedback" class="feedback" aria-live="polite"></div><div class="solution" id="transferSolution"><strong>Reasoning:</strong> ${esc(l.practice.explain)}</div><div class="answerrow"><button id="transferHint" class="btnsoft">Show reasoning</button><button id="completeLesson" class="btnprimary" style="display:none">Complete lesson</button></div><div class="callout"><strong>Exam write-up:</strong> state algorithm, assumptions, formula, substitution, units, and conclusion.</div></div>`}
function answerOk(v,a){if(typeof a==='number'){let n=Number(v.replace(/[, ]/g,''));return Number.isFinite(n)&&Math.abs(n-a)<=Math.max(.01,Math.abs(a)*.002)}return v.toLowerCase().replace(/[^a-z0-9><.]+/g,' ').trim()===String(a).toLowerCase().replace(/[^a-z0-9><.]+/g,' ').trim()}
function attach(l){if($('#ready'))$('#ready').onclick=()=>{mark(0);stage=1;renderStages();renderContent()};if($('#labDone'))$('#labDone').onclick=()=>{mark(1);stage=2;workedIndex=0;renderStages();renderContent()};if($('#revealWork'))$('#revealWork').onclick=()=>{if(workedIndex<l.worked.length-1){workedIndex++;renderContent()}else mark(2)};if($('#workDone'))$('#workDone').onclick=()=>{if(workedIndex>=l.worked.length-1){mark(2);stage=3;renderStages();renderContent()}};if($('#checkBook'))$('#checkBook').onclick=()=>{let ok=answerOk($('#bookAnswer').value.trim(),l.book.answer);$('#bookFeedback').textContent=ok?'Correct. Compare your written derivation with the solution.':'Not yet. '+l.book.hint;$('#bookFeedback').className='feedback '+(ok?'good':'bad');if(ok){$('#bookSolution').classList.add('show');mark(3);setTimeout(()=>{stage=4;quizIndex=0;quizScore=0;renderStages();renderContent()},400)}};if($('#showBook'))$('#showBook').onclick=()=>{$('#bookSolution').classList.toggle('show');$('#bookFeedback').textContent=l.book.hint};if(stage===4)attachQuiz(l);if($('#checkTransfer'))$('#checkTransfer').onclick=()=>{let ok=answerOk($('#transferAnswer').value.trim(),l.practice.answer);$('#transferFeedback').textContent=ok?'Correct — the method transfers to this new case.':'Not yet. Recheck formula, units, and arithmetic.';$('#transferFeedback').className='feedback '+(ok?'good':'bad');if(ok){$('#transferSolution').classList.add('show');$('#completeLesson').style.display='inline-block'}};if($('#transferHint'))$('#transferHint').onclick=()=>$('#transferSolution').classList.toggle('show');if($('#completeLesson'))$('#completeLesson').onclick=()=>{mark(5);stage=0;current=Math.min(current+1,lessons.length-1);workedIndex=0;render()};if(stage===1)attachLab(l)}
function attachQuiz(l){let q=quizItems(l);document.querySelectorAll('[data-qopt]').forEach(b=>b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;let c=+b.dataset.qopt,ok=c===q[quizIndex][2];if(ok)quizScore++;let x=$('#quizExplain');x.style.display='block';x.textContent=(ok?'Correct. ':'Not quite. ')+q[quizIndex][3];setTimeout(()=>{quizIndex++;quizAnswered=false;if(quizIndex>=q.length){if(quizScore>=2)mark(4);renderContent()}else renderContent()},650)});if($('#quizContinue'))$('#quizContinue').onclick=()=>{stage=5;renderStages();renderContent()};if($('#quizRetry'))$('#quizRetry').onclick=()=>{quizIndex=0;quizScore=0;quizAnswered=false;renderContent()}}
function attachLab(l){let on=(id,fn)=>{let e=$('#'+id);if(e){e.oninput=fn;e.onchange=fn}},v=id=>+$('#'+id).value,txt=(id,x)=>{if($('#'+id))$('#'+id).textContent=x};
if(l.lab==='storage'){let f=()=>{let b=v('labB'),d=v('labD');txt('labBv',b);txt('labDv',d);$('#storageViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(24,Math.ceil(b/100))},(_,i)=>`<span class="block ${i<5?'hot':''}">${i+1}</span>`).join('')}</div>`;$('#storageOut').textContent=`T(R)≈${b} blocks×${d} tuples/block=${b*d} tuples; full scan=${b} block I/Os.`};['labB','labD'].forEach(x=>on(x,f));f()}
if(l.lab==='memory'){let f=()=>{let m=v('mMem'),b=v('bMem'),lim=m-1;txt('mMemv',m);txt('bMemv',b);$('#memViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(b,25)},(_,i)=>`<span class="block ${i<lim?'hot':''}">${i+1}</span>`).join('')}</div>`;$('#memOut').textContent=`Usable budget≈M−1=${lim}; ${b} blocks ${b<=lim?'fit: feasible':'do not fit: reject one-pass'}.`};['mMem','bMem'].forEach(x=>on(x,f));f()}
if(l.lab==='bnlj'){let f=()=>{let r=v('bnr'),s=v('bns'),m=v('bnm'),n=Math.ceil(r/Math.max(1,m-1));['bnr','bns','bnm'].forEach(x=>txt(x+'v',v(x)));$('#bnViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(n,18)},(_,i)=>`<span class="block hot">batch ${i+1}</span>`).join('')}</div>`;$('#bnOut').textContent=`batches=ceil(${r}/(${m}−1))=${n}; cost=${r}+${n}×${s}=${r+n*s} I/Os.`};['bnr','bns','bnm'].forEach(x=>on(x,f));f()}
if(l.lab==='sort'){let f=()=>{let b=v('sortB'),m=v('sortM'),runs=Math.ceil(b/m),fan=m-1;txt('sortBv',b);txt('sortMv',m);let n=runs,merge=0;while(n>1){n=Math.ceil(n/fan);merge++}let two=runs<=fan;$('#sortViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(runs,20)},(_,i)=>`<span class="block ${two?'hot':''}">R${i+1}</span>`).join('')}${runs>20?'<span class="tiny">…</span>':''}</div><p class="tiny">${runs} initial runs · fan-in ${fan} · ${merge+1} total passes</p>`;$('#sortOut').textContent=two?`Two-pass feasible. Pipelined cost≈3B=${3*b}; materialized≈4B=${4*b} I/Os.`:'More than two passes are required; 3B is not sufficient.'};['sortB','sortM'].forEach(x=>on(x,f));f()}
if(l.lab==='merge'){let i=0,seq=['R:1<S:2 → emit 1, advance R','R:2=S:2 → emit one 2, skip duplicate 2s','R:5>S:3 → emit 3, advance S','R:5=S:5 → emit one 5'];let d=()=>{$('#mergeFlow').innerHTML=seq.slice(0,i).map((s,n)=>`<span class="node ${n===i-1?'active':''}">${esc(s)}</span>`).join('')||'<span class="node">R:1</span><span class="node">S:2</span>';$('#mergeMsg').textContent=i>=seq.length?'Result: 1,2,3,5':'Step '+(i+1)+' / '+seq.length};$('#mergeStep').onclick=()=>{i=Math.min(seq.length,i+1);d()};d()}
if(l.lab==='hash'||l.lab==='hybrid'){let f=()=>{let r=v('hR'),s=v('hS'),m=v('hM'),tot=r+s;['hR','hS','hM'].forEach(x=>txt(x+'v',v(x)));if(l.lab==='hash'){$('#hashViz').innerHTML='<div class="flow"><span class="node">Read inputs</span><span class="arrow">→</span><span class="node active">Partition</span><span class="arrow">→</span><span class="node">Join pairs</span></div>';$('#hashOut').textContent=`Grace=3×(${r}+${s})=${3*tot} I/Os; feasibility approx min(${r},${s})<M²=${m*m}.`}else{let approx=Math.round((3-2*m/s)*tot);$('#hashViz').innerHTML=`<div class="blocks">${Array.from({length:12},(_,i)=>`<span class="block ${i===0?'hot':''}">${i===0?'RAM':'disk'}</span>`).join('')}</div>`;$('#hashOut').textContent=`Grace=${3*tot}; hybrid approximation≈(3−2M/B(S))×total=${approx} I/Os. Book Example 15.9 uses explicit buckets and reports 4,000.`}};['hR','hS','hM'].forEach(x=>on(x,f));f()}
if(l.lab==='scan'){let f=()=>{let p=v('scanP'),b=v('scanB');txt('scanPv',p);txt('scanBv',b);$('#scanViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(30,Math.ceil(b/40))},(_,i)=>`<span class="block ${i<Math.min(30,Math.ceil(p/40))?'hot':''}">${i+1}</span>`).join('')}</div>`;$('#scanOut').textContent=`Table-scan=${b}; candidate pages=${p}. Index/bitmap helps if added access work+${p}<${b}.`};['scanP','scanB'].forEach(x=>on(x,f));f()}
if(l.lab==='index'){let f=()=>{let k=$('#idxKind').value,t=v('idxT'),b=v('idxB'),d=v('idxV'),c=k==='clustered'?Math.max(1,Math.ceil(b/d)):Math.max(1,Math.ceil(t/d));['idxT','idxB','idxV'].forEach(x=>txt(x+'v',v(x)));$('#idxViz').innerHTML=`<div class="blocks">${Array.from({length:Math.min(24,c)},(_,i)=>`<span class="block ${k==='clustered'?'hot':''}">${k==='clustered'?'page':'tuple'}</span>`).join('')}</div>`;$('#idxOut').textContent=`${k} estimate≈${c} data I/Os; table-scan=${b}.`};['idxKind','idxT','idxB','idxV'].forEach(x=>on(x,f));f()}
if(l.lab==='inlj'){let f=()=>{let t=v('inT'),b=v('inB'),d=v('inV'),c=t*Math.max(1,b/d);['inT','inB','inV'].forEach(x=>txt(x+'v',v(x)));$('#inViz').innerHTML=`<div class="flow"><span class="node">Outer tuple 1</span><span class="arrow">→</span><span class="node active">Index probe</span><span class="arrow">→</span><span class="node">repeat ${t} times</span></div>`;$('#inOut').textContent=`Example base B(R)=1,000; clustered estimate≈1,000+${t}×max(1,${b}/${d})=${1000+c} I/Os.`};['inT','inB','inV'].forEach(x=>on(x,f));f()}
if(l.lab==='zigzag'){let i=0,seq=['skip R:1','skip S:2,2','skip R:3','match key 4 groups','skip R:5','match key 6'];let d=()=>{$('#zRows').innerHTML=`<span class="node">R: 1,3,4,4,4,5,6</span><span class="node">S: 2,2,4,4,6,7</span><span class="node active">${esc(seq[Math.max(0,i-1)]||'Start at first keys')}</span>`;$('#zMsg').textContent=i>=seq.length?'Matched groups: 4 and 6':'Step '+(i+1)+' / '+seq.length};$('#zStep').onclick=()=>{i=Math.min(seq.length,i+1);d()};d()}
if(l.lab==='compiler'){let i=0,ss=['SQL','Parse + semantic check','Logical plan','Rewrite + estimate','Physical plan','Execute'],d=()=>{$('#compilerFlow').innerHTML=ss.map((s,n)=>`<span class="node ${n===Math.min(i,ss.length-1)?'active':''}">${s}</span>${n<ss.length-1?'<span class="arrow">→</span>':''}`).join('');$('#compilerMsg').textContent='Stage '+(i+1)+' / '+ss.length};$('#compilerStep').onclick=()=>{i=Math.min(ss.length-1,i+1);d()};d()}
if(l.lab==='rewrite')$('#rewriteBtn').onclick=()=>$('#rewriteInfo').classList.toggle('show');if(l.lab==='cardinality'){let f=()=>{let t=v('cardT'),d=v('cardV');txt('cardTv',t);txt('cardVv',d);$('#cardBars').innerHTML=Array.from({length:15},(_,i)=>`<i class="bar" style="height:${Math.max(8,30+(i%5)*12)}%"><span>${i===5?'c':'·'}</span></i>`).join('');$('#cardOut').textContent=`Equality estimate T/V=${t}/${d}=${Math.ceil(t/d)} tuples under uniformity.`};['cardT','cardV'].forEach(x=>on(x,f));f()}
if(l.lab==='hist'){let f=()=>{let c=v('histBucket'),a=[100,500,400];$('#histBars').innerHTML=a.map(n=>`<i class="bar" style="height:${n/5}%;${n===c?'background:linear-gradient(180deg,var(--accent),#277866)':''}"><span>${n}</span></i>`).join('');$('#histOut').textContent=`Bucket frequency=${c}; total=1,000; selectivity=${c/10}%.`};on('histBucket',f);f()}
if(l.lab==='access'){let f=()=>{let t=v('accT'),d=v('accV'),b=v('accB'),i=Math.ceil(t/d);['accT','accV','accB'].forEach(x=>txt(x+'v',v(x)));$('#accViz').innerHTML=`<div class="compare"><div>Index estimate: <strong>${i}</strong> I/Os</div><div>Table scan: <strong>${b}</strong> I/Os</div></div>`;$('#accOut').textContent=`Choose ${i<b?'index path':'table scan'} under this simplified unclustered model; retain residual filters.`};['accT','accV','accB'].forEach(x=>on(x,f));f()}
if(l.lab==='joins')$('#joinCompare').onclick=()=>$('#joinInfo').classList.toggle('show');if(l.lab==='dp')$('#dpBtn').onclick=()=>$('#dpInfo').classList.toggle('show');if(l.lab==='choose'){let f=()=>{let t=v('chT'),idx=$('#chIdx').value;txt('chTv',t);$('#chooseFlow').innerHTML=`<span class="node">Block NLJ</span><span class="node">Grace hash</span><span class="node">Sort-merge</span><span class="node ${idx==='yes'?'active':''}">Index NLJ ${idx}</span>`;$('#chooseOut').textContent=`A ${t}-tuple outer with inner index makes INLJ a candidate; also cost scan/hash/sort competitors.`};['chT','chIdx'].forEach(x=>on(x,f));f()}
if(l.lab==='pipeline'){let f=()=>{let k=v('pipeK'),m=$('#pipeMode').value;txt('pipeKv',k);$('#pipeFlow').innerHTML=m==='pipe'?'<span class="node active">Producer</span><span class="arrow">→</span><span class="node active">Consumer</span><span class="tiny">no full intermediate file</span>':`<span class="node">Producer</span><span class="arrow">→</span><span class="node active">Write ${k}</span><span class="arrow">→</span><span class="node active">Read ${k}</span>`;$('#pipeOut').textContent=m==='pipe'?`Pipeline avoids full-file I/O for ${k} blocks if memory/operator flow permits.`:`Materializing ${k} blocks adds about ${2*k} I/Os (write + reread).`};['pipeK','pipeMode'].forEach(x=>on(x,f));f()}}
$('#search').oninput=renderNav;$('#reset').onclick=()=>{if(confirm('Clear all saved SC3020 tutor progress on this device?')){localStorage.removeItem(stateKey);saved={done:{},quiz:{},lesson:0};current=0;stage=0;workedIndex=0;render()}};$('#prevLesson').onclick=()=>{current=Math.max(0,current-1);stage=0;workedIndex=0;render()};$('#nextLesson').onclick=()=>{current=Math.min(lessons.length-1,current+1);stage=0;workedIndex=0;render()};render();
</script></body></html>
